<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Reminder</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card"> 
        <h1>Take yo' Meds</h1>
        <img id="photo" src="images/reminder.gif" alt="pokemon eating">

        <p id="reminder">It's 1pm did you take yo' meds??? !!</p>

        <button id="yes-btn">Yes</button>
        <button id="no-btn">No</button>
        <button id="camera-btn" hidden>Open Camera</button>
        <video id="camera" autoplay hidden></video>
        <button id="snap-btn" hidden>Take Photo</button>
        <div id="photo-box">
        <canvas id="snapshot" hidden></canvas>
        <img id="sticker" src="images/sticker.png" hidden>
        </div>

    </div>

<script src="script.js"></script>


</body>
</html>
